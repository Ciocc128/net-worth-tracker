# CI step 1 (F06, D-T1): types, lint and unit tests on every pull request to main.
# Same commands as WORKFLOW.md § 3. Step 2 (F11): the Firestore rules suite on the emulator.
# The e2e on the emulators is a later step.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint app components lib types e2e scripts __tests__ --max-warnings 0
      - name: Unit tests
        run: npx vitest run
        env:
          TZ: Europe/Rome

  # The rules suite (doc/sicurezza/S3-regole.md, D-RG1) is not part of `npm test`: it needs the
  # Firestore emulator, which runs on Java >= 21. A separate job, so a red suite names itself.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Firestore rules
        run: npm run test:rules
